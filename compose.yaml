services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: deskbooker
      POSTGRES_USER: deskbooker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - deskbooker_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deskbooker -d deskbooker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  deskbooker_pgdata:
